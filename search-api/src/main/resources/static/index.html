<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Semantic Product Search — Strategy Comparison</title>
<style>
  :root {
    --bg: #f7f5f1;
    --surface: #ffffff;
    --surface-alt: #efebe3;
    --text: #211f1b;
    --text-muted: #6b655c;
    --accent: #0e6b64;
    --accent-contrast: #ffffff;
    --rank1: #c08a2e;
    --rank1-bg: #fbf1de;
    --border: #e2ddd3;
    --shadow: 0 1px 2px rgba(33, 31, 27, 0.06), 0 4px 12px rgba(33, 31, 27, 0.05);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171512;
      --surface: #201d19;
      --surface-alt: #2a2620;
      --text: #edeae4;
      --text-muted: #a39c90;
      --accent: #3fbfb3;
      --accent-contrast: #0a1817;
      --rank1: #e0ac55;
      --rank1-bg: #332a18;
      --border: #34302a;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.25);
    }
  }
  :root[data-theme="dark"] {
    --bg: #171512;
    --surface: #201d19;
    --surface-alt: #2a2620;
    --text: #edeae4;
    --text-muted: #a39c90;
    --accent: #3fbfb3;
    --accent-contrast: #0a1817;
    --rank1: #e0ac55;
    --rank1-bg: #332a18;
    --border: #34302a;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.25);
  }
  :root[data-theme="light"] {
    --bg: #f7f5f1;
    --surface: #ffffff;
    --surface-alt: #efebe3;
    --text: #211f1b;
    --text-muted: #6b655c;
    --accent: #0e6b64;
    --accent-contrast: #ffffff;
    --rank1: #c08a2e;
    --rank1-bg: #fbf1de;
    --border: #e2ddd3;
    --shadow: 0 1px 2px rgba(33, 31, 27, 0.06), 0 4px 12px rgba(33, 31, 27, 0.05);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .mono {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 1.25rem 1.5rem;
  }

  .title-row {
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
    flex-wrap: wrap;
    margin-bottom: 0.9rem;
  }

  h1 {
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 0.85rem;
  }

  form {
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
    align-items: center;
  }

  input[type="text"] {
    flex: 1 1 320px;
    min-width: 200px;
    padding: 0.55rem 0.8rem;
    font-size: 0.95rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
  }

  input[type="text"]:focus, input[type="number"]:focus, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  input[type="number"] {
    width: 4.5rem;
    padding: 0.55rem 0.5rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font-family: inherit;
  }

  label.count-label {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    color: var(--text-muted);
    font-size: 0.85rem;
    white-space: nowrap;
  }

  button {
    padding: 0.55rem 1.1rem;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-contrast);
    cursor: pointer;
  }

  button:disabled { opacity: 0.6; cursor: default; }

  main {
    padding: 1.25rem 1.5rem 2.5rem;
  }

  .status {
    color: var(--text-muted);
    font-size: 0.9rem;
    margin-bottom: 0.75rem;
    min-height: 1.2em;
  }
  .status.error { color: #b3453f; }

  .pick-note {
    color: var(--text-muted);
    font-size: 0.78rem;
    margin: 0.9rem 0 0;
  }

  .columns-scroller {
    overflow-x: auto;
    padding-bottom: 0.5rem;
  }

  .columns {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: minmax(260px, 1fr);
    gap: 1rem;
    min-width: min-content;
  }

  .column {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .column.picked {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }

  .column-header {
    padding: 0.8rem 1rem;
    background: var(--surface-alt);
    border-bottom: 1px solid var(--border);
  }

  .column-header .name-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.5rem;
  }

  .column-header .name {
    font-weight: 700;
    font-size: 0.95rem;
    text-wrap: balance;
  }

  .column-header .latency {
    color: var(--text-muted);
    font-size: 0.72rem;
    white-space: nowrap;
  }

  .column-header .description {
    color: var(--text-muted);
    font-size: 0.76rem;
    margin-top: 0.3rem;
    line-height: 1.35;
  }

  .column-header .meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--text-muted);
    font-size: 0.78rem;
    margin-top: 0.4rem;
  }

  .ndcg-badge {
    display: inline-flex;
    align-items: baseline;
    gap: 0.25rem;
    background: var(--rank1-bg);
    color: var(--rank1);
    border-radius: 999px;
    padding: 0.1rem 0.5rem;
    font-size: 0.7rem;
    font-weight: 700;
  }

  .pick-button {
    margin: 0.7rem 1rem 0.9rem;
    padding: 0.45rem 0.7rem;
    font-size: 0.78rem;
    font-weight: 600;
    background: var(--surface-alt);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    align-self: stretch;
  }
  .pick-button:hover { border-color: var(--accent); }
  .column.picked .pick-button {
    background: var(--accent);
    color: var(--accent-contrast);
    border-color: var(--accent);
  }

  .card {
    display: flex;
    gap: 0.7rem;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border);
    align-items: flex-start;
  }
  .card:last-child { border-bottom: none; }

  .card.rank-1 {
    background: var(--rank1-bg);
  }

  .rank {
    flex: 0 0 auto;
    width: 1.6rem;
    height: 1.6rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: var(--surface-alt);
    color: var(--text-muted);
    font-size: 0.75rem;
    font-weight: 700;
  }
  .card.rank-1 .rank {
    background: var(--rank1);
    color: #2a1c04;
  }

  .card-body { min-width: 0; flex: 1 1 auto; }

  .product-name {
    font-size: 0.88rem;
    font-weight: 600;
    line-height: 1.3;
    text-transform: capitalize;
  }

  .category {
    color: var(--text-muted);
    font-size: 0.75rem;
    margin-top: 0.15rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    margin-top: 0.3rem;
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  .score {
    color: var(--text);
  }

  .empty, .placeholder {
    padding: 2rem 1rem;
    text-align: center;
    color: var(--text-muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<header>
  <div class="title-row">
    <h1>Semantic Product Search</h1>
    <span class="subtitle">— strategy comparison over the WANDS furniture catalog</span>
  </div>
  <form id="search-form">
    <input type="text" id="query" name="query" placeholder="Try: queen size platform bed frame" autocomplete="off" />
    <label class="count-label" for="topK">top<input type="number" id="topK" name="topK" value="5" min="1" max="20" /></label>
    <button type="submit" id="submit-button">Compare</button>
  </form>
</header>
<main>
  <div class="status" id="status"></div>
  <div class="columns-scroller">
    <div class="columns" id="columns">
      <div class="placeholder">Enter a query above to compare Lexical, Semantic, Hybrid, and Reranked results side by side.</div>
    </div>
  </div>
  <p class="pick-note" id="pick-note" hidden>Click "This looks best" under whichever column you'd pick — it's just for you, nothing is saved or sent anywhere.</p>
</main>
<script>
  const form = document.getElementById('search-form');
  const statusEl = document.getElementById('status');
  const columnsEl = document.getElementById('columns');
  const pickNoteEl = document.getElementById('pick-note');
  const submitButton = document.getElementById('submit-button');

  // Offline nDCG@10 from search-eval against the WANDS relevance judgments (see RESULTS.md) —
  // matched by keyword against the live strategy name, so it survives the RRF constant (k=NN)
  // changing between eval runs.
  const STRATEGY_INFO = [
    { match: 'lexical', description: 'Exact keyword matching (BM25) — finds products containing your literal words.', ndcg: 0.6707 },
    { match: 'semantic', description: 'Dense vector search — finds conceptually similar products even without matching words.', ndcg: 0.6990 },
    { match: 'rerank', description: 'Cross-encoder re-scores the hybrid results by reading your query against each product directly. Highest quality, most latency.', ndcg: 0.7456 },
    { match: 'hybrid', description: 'Combines the lexical and semantic rankings above via Reciprocal Rank Fusion.', ndcg: 0.7308 },
  ];

  function strategyInfo(name) {
    const lower = name.toLowerCase();
    return STRATEGY_INFO.find((s) => lower.includes(s.match)) ?? { description: '', ndcg: null };
  }

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function renderColumn(strategyName, strategyResult) {
    const { latencyMs, results } = strategyResult;
    const info = strategyInfo(strategyName);

    const cards = results.length
      ? results.map((r, i) => `
        <div class="card${i === 0 ? ' rank-1' : ''}">
          <div class="rank">${i + 1}</div>
          <div class="card-body">
            <div class="product-name">${escapeHtml(r.productName ?? r.productId)}</div>
            <div class="category">${escapeHtml(r.categoryHierarchy ?? '')}</div>
            <div class="card-footer">
              <span>${r.averageRating != null ? '★ ' + r.averageRating.toFixed(1) + ' (' + (r.ratingCount ?? 0) + ')' : ''}</span>
              <span class="score mono">${r.score.toFixed(3)}</span>
            </div>
          </div>
        </div>`).join('')
      : '<div class="empty">No results</div>';

    return `
      <div class="column" data-strategy="${escapeHtml(strategyName)}">
        <div class="column-header">
          <div class="name-row">
            <div class="name">${escapeHtml(strategyName)}</div>
            <div class="latency mono">${latencyMs}ms</div>
          </div>
          <div class="description">${escapeHtml(info.description)}</div>
          <div class="meta">
            <span class="mono">${results.length} result${results.length === 1 ? '' : 's'}</span>
            ${info.ndcg != null ? `<span class="ndcg-badge">nDCG@10 ${info.ndcg.toFixed(4)}</span>` : ''}
          </div>
        </div>
        ${cards}
        <button type="button" class="pick-button">This looks best</button>
      </div>`;
  }

  function wirePickButtons() {
    const columns = columnsEl.querySelectorAll('.column');
    columns.forEach((column) => {
      column.querySelector('.pick-button').addEventListener('click', () => {
        const alreadyPicked = column.classList.contains('picked');
        columns.forEach((c) => c.classList.remove('picked'));
        if (!alreadyPicked) {
          column.classList.add('picked');
        }
      });
    });
  }

  async function runCompare(query, topK) {
    statusEl.className = 'status';
    statusEl.textContent = 'Searching…';
    pickNoteEl.hidden = true;
    submitButton.disabled = true;
    const start = performance.now();
    try {
      const response = await fetch(`/api/search/compare?query=${encodeURIComponent(query)}&topK=${encodeURIComponent(topK)}`);
      if (!response.ok) {
        throw new Error(`Request failed (${response.status})`);
      }
      const data = await response.json();
      const elapsedMs = Math.round(performance.now() - start);
      columnsEl.innerHTML = Object.entries(data.resultsByStrategy)
        .map(([name, strategyResult]) => renderColumn(name, strategyResult))
        .join('');
      wirePickButtons();
      pickNoteEl.hidden = false;
      statusEl.textContent = `"${data.query}" — ${elapsedMs}ms round-trip; per-column latency shown above`;
    } catch (err) {
      statusEl.className = 'status error';
      statusEl.textContent = err.message || 'Something went wrong.';
    } finally {
      submitButton.disabled = false;
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const query = document.getElementById('query').value.trim();
    const topK = document.getElementById('topK').value || 5;
    if (query) {
      runCompare(query, topK);
    }
  });
</script>
</body>
</html>
