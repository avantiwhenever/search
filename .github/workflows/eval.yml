name: Offline eval regression gate

# Full-catalog eval: ingests all ~43K products with real embeddings and runs
# all 480 WANDS queries against all four strategies, failing the job if any
# strategy's nDCG@10 drops below ci/eval-baseline.json. This only runs on
# pushes to main and on manual dispatch, not on every PR commit — see
# .github/workflows/build.yml for the fast unit-test gate that does run on
# every push/PR.
#
# The Elasticsearch data directory is cached (keyed on whatever determines
# the ingested index's contents: the catalog, the embedding model, and the
# ingestion/mapping code) so the ~43K-product embedding step — the genuinely
# slow part, since it's CPU-bound ONNX inference, not I/O — only reruns when
# one of those actually changed, rather than on every push. Elasticsearch is
# started via a plain `docker run` rather than the declarative `services:`
# block specifically so the cache can be restored to its data directory
# *before* the container starts — `services:` containers start before any
# of a job's own steps run, which would be too late to matter.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ES_DATA_DIR: ${{ github.workspace }}/es-data

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Cache WANDS dataset
        id: cache-dataset
        uses: actions/cache@v4
        with:
          path: dataset
          key: wands-dataset-${{ hashFiles('scripts/download-dataset.sh') }}

      - name: Fetch WANDS dataset
        if: steps.cache-dataset.outputs.cache-hit != 'true'
        run: ./scripts/download-dataset.sh

      - name: Cache ONNX models
        id: cache-models
        uses: actions/cache@v4
        with:
          path: models
          key: onnx-models-${{ hashFiles('scripts/download-models.sh') }}

      - name: Fetch ONNX models
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: ./scripts/download-models.sh

      - name: Build ingestion + eval jars
        run: mvn -B -q -pl search-ingestion,search-eval -am package -DskipTests

      # Anything that changes what gets indexed (the catalog itself, the
      # embedding model, the mapping, or the ingestion/text-building code)
      # must invalidate this cache — hashing just product.csv would miss a
      # code change that alters the index contents without touching the data.
      - name: Compute Elasticsearch index cache key
        id: es-cache-key
        run: |
          hash=$(cat dataset/product.csv \
                     scripts/download-models.sh \
                     search-retrieval/src/main/resources/elasticsearch/products-mapping.json \
                     search-retrieval/src/main/java/com/avanti/search/retrieval/ProductDocument.java \
                     search-ingestion/src/main/java/com/avanti/search/ingestion/IngestionCli.java \
                     search-common/src/main/java/com/avanti/search/common/EmbeddingTextBuilder.java \
                   | sha256sum | cut -d' ' -f1)
          echo "key=es-index-${hash}" >> "$GITHUB_OUTPUT"

      - name: Restore cached Elasticsearch index
        id: cache-es-data
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.ES_DATA_DIR }}
          key: ${{ steps.es-cache-key.outputs.key }}

      - name: Start Elasticsearch
        run: |
          mkdir -p "${ES_DATA_DIR}"
          # The official image runs as uid 1000; a freshly-created runner
          # directory won't be writable by it otherwise.
          sudo chown -R 1000:1000 "${ES_DATA_DIR}"
          docker run -d --name elasticsearch \
            -p 9200:9200 \
            -v "${ES_DATA_DIR}:/usr/share/elasticsearch/data" \
            -e discovery.type=single-node \
            -e xpack.security.enabled=false \
            -e xpack.security.http.ssl.enabled=false \
            -e ES_JAVA_OPTS="-Xms1g -Xmx1g" \
            docker.elastic.co/elasticsearch/elasticsearch:9.4.3

      - name: Wait for Elasticsearch
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:9200/_cluster/health && exit 0
            sleep 2
          done
          echo "Elasticsearch did not become healthy in time" >&2
          docker logs elasticsearch
          exit 1

      - name: Ingest catalog if the cached index is missing or stale
        run: |
          expected=$(($(wc -l < dataset/product.csv) - 1))
          actual=$(curl -sf "http://localhost:9200/products/_count" 2>/dev/null || echo '{"count":0}')
          actual=$(echo "${actual}" | jq -r '.count // 0')
          if [ "${{ steps.cache-es-data.outputs.cache-hit }}" = "true" ] && [ "${actual}" = "${expected}" ]; then
            echo "Cached index already has all ${expected} products — skipping re-ingestion."
          else
            echo "Cache miss or stale (index has ${actual}, expected ${expected}) — ingesting all ${expected} products with embeddings."
            java -jar search-ingestion/target/search-ingestion.jar --recreate
          fi

      - name: Run offline eval against the regression baseline
        run: java -jar search-eval/target/search-eval.jar --baseline-file ci/eval-baseline.json

      - name: Stop Elasticsearch cleanly
        if: always()
        run: docker stop elasticsearch

      - name: Save Elasticsearch index cache
        # actions/cache/save silently no-ops if this exact key already exists
        # (a cache-hit run whose index turned out to still be valid), so this
        # doesn't need its own cache-hit guard.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.ES_DATA_DIR }}
          key: ${{ steps.es-cache-key.outputs.key }}

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            RESULTS.md
            results/
